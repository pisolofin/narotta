schema_name: NaRotta World Overview
schema_description: Low-zoom global and continental overview tiles (Zoom 0 to 7) with boundaries, water, major highways, and capitals.
attribution: "<a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\">&copy; OpenStreetMap contributors</a>"
args:
  minzoom: 0
  maxzoom: 7
  osm_url:
    description: OSM file path or download URL
    default: data/sources/osm.pbf

sources:
  osm:
    type: osm
    url: "${args.osm_url}"

layers:
  - id: water
    features:
      - source: osm
        geometry: polygon
        min_zoom: 0
        max_zoom: 7
        min_size: 2.0
        include_when:
          natural:
            - water
            - bay
            - strait
          waterway:
            - riverbank
          landuse:
            - reservoir

  - id: boundary
    features:
      - source: osm
        geometry: line
        min_zoom: 0
        max_zoom: 7
        include_when:
          boundary: administrative
          admin_level:
            - "2"
            - "4"
        attributes:
          - key: admin_level
            type: integer
          - key: maritime
            type: boolean

  - id: transportation
    features:
      - source: osm
        geometry: line
        min_zoom: 4
        max_zoom: 7
        include_when:
          highway:
            - motorway
            - trunk
        attributes:
          - key: class
            tag_value: highway
          - key: ref
            tag_value: ref

  - id: place
    features:
      - source: osm
        geometry: point
        min_zoom: 1
        max_zoom: 7
        include_when:
          place:
            - country
            - state
            - city
        attributes:
          - key: name
            tag_value: name
          - key: class
            tag_value: place
          - key: capital
            tag_value: capital
          - key: population
            tag_value: population
            type: integer
